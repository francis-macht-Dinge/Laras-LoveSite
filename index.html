<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Before we begin.</title>

    <meta
        name="description"
        content="Before we begin."
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================
           VARIABLES
        ========================================== */

        :root {
            --cream: #f8f5ef;
            --brown-dark: #302721;
            --brown-light: #75665c;
            --taupe: #cdbfaf;
        }


        /* =========================================
           RESET
        ========================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }


        body {
            background: var(--cream);
            color: var(--brown-dark);

            font-family:
                "DM Sans",
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =========================================
           PAGE
        ========================================== */

        .intro-page {
            min-height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 3rem 1.5rem;

            text-align: center;
        }


        .intro-inner {
            width: 100%;
            max-width: 560px;
        }


        /* =========================================
           EYEBROW
        ========================================== */

        .intro-eyebrow {
            margin: 0 0 1.5rem;

            color: var(--brown-light);

            font-size: 0.72rem;
            font-weight: 500;

            letter-spacing: 0.18em;
            text-transform: uppercase;
        }


        /* =========================================
           TITLE
        ========================================== */

        .intro-title {
            margin: 0;

            color: var(--brown-dark);

            font-family:
                "Playfair Display",
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(
                    3rem,
                    12vw,
                    5.5rem
                );

            font-weight: 400;

            line-height: 0.98;
        }


        .intro-title em {
            font-style: italic;
        }


        /* =========================================
           QUESTION
        ========================================== */

        .intro-question {
            max-width: 420px;

            margin:
                2.25rem
                auto
                2.5rem;

            color: var(--brown-light);

            font-size: 1rem;
            line-height: 1.7;
        }


        /* =========================================
           BUTTONS
        ========================================== */

        .intro-buttons {
            display: flex;

            flex-direction: column;

            gap: 0.85rem;

            width: 100%;
            max-width: 340px;

            margin: 0 auto;
        }


        .intro-button {
            width: 100%;

            padding:
                1rem
                1.5rem;

            border-radius: 999px;

            font-family:
                "DM Sans",
                Arial,
                Helvetica,
                sans-serif;

            font-size: 0.9rem;
            font-weight: 500;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease,
                background 0.2s ease;
        }


        .intro-button:hover {
            transform: translateY(-2px);
        }


        .intro-button:active {
            transform: translateY(0);
        }


        /* =========================================
           YES
        ========================================== */

        .intro-button-yes {
            border:
                1px solid var(--brown-dark);

            background:
                var(--brown-dark);

            color:
                var(--cream);
        }


        /* =========================================
           NO
        ========================================== */

        .intro-button-no {
            border:
                1px solid var(--taupe);

            background:
                transparent;

            color:
                var(--brown-dark);
        }


        /* =========================================
           FOOTER
        ========================================== */

        .intro-footer {
            margin-top: 4rem;

            color: var(--brown-light);

            font-family:
                "Playfair Display",
                Georgia,
                serif;

            font-size: 0.8rem;

            opacity: 0.75;
        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 480px) {

            .intro-page {
                padding:
                    2rem 1.25rem;
            }


            .intro-title {
                font-size: 3.4rem;
            }


            .intro-question {
                margin-top: 2rem;
            }


            .intro-footer {
                margin-top: 3rem;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         SINGLE CHECK
    ========================================== -->

    <main class="intro-page">

        <div class="intro-inner">


            <p class="intro-eyebrow">
                Before we begin
            </p>


            <h1 class="intro-title">

                Eine kleine
                <br>
                <em>Frage.</em>

            </h1>


            <p class="intro-question">
                Bist du aktuell single?
            </p>


            <div class="intro-buttons">


                <button
                    type="button"
                    class="intro-button intro-button-yes"
                    id="singleYes"
                >
                    Ja
                </button>


                <button
                    type="button"
                    class="intro-button intro-button-no"
                    id="singleNo"
                >
                    Nein
                </button>


            </div>


            <p class="intro-footer">
                Be honest. ♡
            </p>


        </div>

    </main>


    <!-- =========================================
         NAVIGATION
    ========================================== -->

    <script>

        const singleYes =
            document.getElementById(
                "singleYes"
            );


        const singleNo =
            document.getElementById(
                "singleNo"
            );


        /*
         * JA
         * → Dating-Seite
         */

        singleYes.addEventListener(
            "click",
            () => {

                window.location.href =
                    "dating.html";

            }
        );


        /*
         * NEIN
         * → Absage
         */

        singleNo.addEventListener(
            "click",
            () => {

                window.location.href =
                    "sorry.html";

            }
        );

    </script>


</body>

</html>
